# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Covers the root manifest and every workspace it declares — home-shared,
  # home-server, and home-web-ui. All four share the single root
  # package-lock.json, so Dependabot resolves and updates them together here.
  #
  # Do not add per-workspace entries (directory: "/home-web-ui" and friends).
  # Dependabot would bump that workspace's package.json without regenerating the
  # root package-lock.json, and `npm ci` in CI fails on the mismatch.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # ci.yml pins actions/checkout, actions/setup-node, and actions/cache by major
  # version. Nothing else in the repo updates them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
