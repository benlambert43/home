name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Full CI Run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: home-web-ui/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Stub environment variables
        run: npm run env:placeholders

      - name: Format and Lint
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run lint:deprecations
          npm run lint:shell

      - name: Build
        run: npm run build

  smoke-test-full-build:
    name: Smoke Test (Full Build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Load smoke environment
        run: cat smoke.env >> "$GITHUB_ENV"

      - name: Validate compose files
        run: |
          docker compose --env-file smoke.env config --quiet
          docker compose --env-file smoke.env -f docker-compose.dev.yml config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: home-server/Dockerfile
          load: true
          tags: home-smoke-api
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: home-web-ui/Dockerfile
          build-args: |
            BASE_SITE_URL
            NEXT_PUBLIC_CAPTCHA_PUBLIC
          load: true
          tags: home-smoke-web
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test
        run: npm run smoke -- --no-build
